name: Main
on:
  schedule:
    - cron:  '0 1 * * *'
  push:
  pull_request:
  workflow_dispatch:
  
jobs:
  validate:
    if: ${{ github.repository_owner == 'tomasmcguinness' }}
    name: Validate
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v6
      - uses: "home-assistant/actions/hassfest@master"
      - name: HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"
